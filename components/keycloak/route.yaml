apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  namespace: grid-sso
spec:
  host: keycloak-grid-sso.REPLACE_WITH_APPS_DOMAIN
  to:
    kind: Service
    name: keycloak
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
