apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgresql-headless
  namespace: grid-sso
  labels:
    app.kubernetes.io/name: keycloak-postgresql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: keycloak-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgresql
  namespace: grid-sso
  labels:
    app.kubernetes.io/name: keycloak-postgresql
spec:
  selector:
    app.kubernetes.io/name: keycloak-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgresql
  namespace: grid-sso
  labels:
    app.kubernetes.io/name: keycloak-postgresql
spec:
  serviceName: keycloak-postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-postgresql
    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-16-c9s:latest
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: keycloak-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
