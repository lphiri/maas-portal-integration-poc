apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: grid-sso
type: Opaque
stringData:
  POSTGRESQL_USER: keycloak
  POSTGRESQL_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_DATABASE_PASSWORD
  POSTGRESQL_DATABASE: keycloak
  KC_BOOTSTRAP_ADMIN_USERNAME: REPLACE_WITH_ADMIN_USERNAME
  KC_BOOTSTRAP_ADMIN_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_ADMIN_PASSWORD
  KEYCLOAK_CLIENT_ID: tenant-demo
  KEYCLOAK_HOME_URL: http://localhost:8000
  KEYCLOAK_REDIRECT_URI: http://localhost:8000/callback
  KEYCLOAK_CLIENT_SECRET: REPLACE_WITH_A_LONG_RANDOM_TENANT_DEMO_CLIENT_SECRET
  GRID_TENANT_1_BROKER_CLIENT_SECRET: REPLACE_WITH_A_LONG_RANDOM_TENANT_1_BROKER_SECRET
  GRID_TENANT_2_BROKER_CLIENT_SECRET: REPLACE_WITH_A_LONG_RANDOM_TENANT_2_BROKER_SECRET
  GRID_TENANT_1_TEST_USER_PASSWORD: REPLACE_WITH_A_TENANT_1_TEST_PASSWORD
  GRID_TENANT_2_TEST_USER_PASSWORD: REPLACE_WITH_A_TENANT_2_TEST_PASSWORD
