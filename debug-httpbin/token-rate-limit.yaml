apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: maas-debug-httpbin-non-inference
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: maas-debug-httpbin
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: maas-debug-httpbin
  defaults:
    strategy: atomic
    limits:
      non-inference:
        rates:
          - limit: 0
            window: 1m
        when:
          - predicate: 'false'
