apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: maas-debug-httpbin-payload-bypass
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: maas-debug-httpbin
spec:
  priority: 20
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: maas-default-gateway
  configPatches:
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            route:
              name: redhat-ods-applications.maas-debug-httpbin.0
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_proc.ipp-pre:
              '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
            envoy.filters.http.ext_proc.ipp:
              '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
