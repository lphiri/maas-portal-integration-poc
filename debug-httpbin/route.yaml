apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-debug-httpbin
  namespace: $(workloadNamespace)
  labels:
    app.kubernetes.io/part-of: maas-debug-httpbin
spec:
  hostnames:
    - $(publicHostname)
  parentRefs:
    - name: $(gatewayName)
      namespace: $(gatewayNamespace)
      sectionName: $(gatewayListenerName)
  rules:
    - matches:
        - path:
            type: Exact
            value: $(debugPublicPath)
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: $(debugBackendPath)
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Cookie
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
      backendRefs:
        - name: maas-debug-httpbin
          port: 8080
