apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maas-debug-httpbin
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: maas-debug-httpbin
spec:
  podSelector:
    matchLabels:
      app: maas-debug-httpbin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: maas-default-gateway
      ports:
        - protocol: TCP
          port: 8080
