apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: $(portalRouteName)
  namespace: $(workloadNamespace)
  labels:
    app.kubernetes.io/part-of: $(partOfLabel)
spec:
  hostnames:
    - $(publicHostname)
  parentRefs:
    - name: $(gatewayName)
      namespace: $(gatewayNamespace)
      sectionName: $(gatewayListenerName)
  rules:
    - matches:
        - path:
            type: Exact
            value: $(portalPathPrefix)
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: $(portalPathPrefix)/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: $(portalPathPrefix)
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: $(portalRewritePrefix)
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-auth-request-preferred-username
              - x-auth-request-groups
              - x-auth-request-access-token
              - x-forwarded-user
              - x-forwarded-email
              - x-forwarded-groups
              - x-forwarded-preferred-username
              - x-maas-username
              - x-maas-group
              - x-maas-orgid
              - x-maas-roles
              - x-maas-keyname
              - x-maas-subscription-rate-limit-id
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
      backendRefs:
        - name: $(portalServiceName)
          port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: $(oauthRouteName)
  namespace: $(workloadNamespace)
  labels:
    app.kubernetes.io/part-of: $(partOfLabel)
spec:
  hostnames:
    - $(publicHostname)
  parentRefs:
    - name: $(gatewayName)
      namespace: $(gatewayNamespace)
      sectionName: $(gatewayListenerName)
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: $(oauthPathPrefix)
      backendRefs:
        - name: $(authProxyName)
          port: 4180
