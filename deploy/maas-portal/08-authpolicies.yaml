apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: $(portalRouteName)-oidc
  namespace: $(workloadNamespace)
  annotations:
    auth-proxy-service-url: http://$(authProxyName).$(workloadNamespace).svc.$(clusterDnsDomain):$(authProxyHttpPort)$(oauthPathPrefix)/auth
  labels:
    app.kubernetes.io/part-of: $(partOfLabel)
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: $(portalRouteName)
  rules:
    authentication:
      direct-jwt:
        priority: 0
        jwt:
          issuerUrl: $(oidcIssuerUrl)
          ttl: 300
        credentials:
          authorizationHeader:
            prefix: Bearer
      browser:
        priority: 1
        when:
          - predicate: '!has(request.headers.authorization)'
        anonymous: {}
    authorization:
      session-and-identity:
        priority: 0
        opa:
          allValues: true
          rego: |
            allow = true

            login_location := sprintf("$(oauthPathPrefix)/start?rd=%s", [urlquery.encode(input.context.request.http.path)])

            application_cookies := concat("; ", [entry |
              raw := split(object.get(input.context.request.http.headers, "cookie", ""), ";")[_]
              entry := trim_space(raw)
              entry != ""
              name := trim_space(split(entry, "=")[0])
              not startswith(name, "_maas_consumer_proxy")
            ])

            organization = result {
              orgs := object.get(organization_claims, "$(organizationClaim)", [])
              count(orgs) == 1
              org := orgs[0]
              org_id := object.get(org, "$(organizationIdPrimaryClaim)", object.get(org, "$(organizationIdFallbackClaim)", ""))
              is_string(org_id)
              org_id != ""
              roles := object.get(org, "roles", [])
              is_array(roles)
              result := {
                "org_id": org_id,
                "roles_header": json.marshal(roles)
              }
            } else = {"org_id": "", "roles_header": "[]"}

            organization_claims = claims {
              not input.auth.identity.anonymous
              claims := input.auth.identity
            } else = claims {
              identity.authenticated
              [_, claims, _] := io.jwt.decode(identity.access_token)
            } else = {}

            identity = result {
              not input.auth.identity.anonymous
              claims := input.auth.identity
              usernames := [user |
                user := [object.get(claims, "$(usernamePrimaryClaim)", ""), object.get(claims, "$(usernameFallbackClaim)", "")][_]
                user != ""
              ]
              username := usernames[0]
              authorization := input.context.request.http.headers.authorization
              groups := {trim_space(group) |
                group := object.get(claims, "$(oidcGroupsClaim)", [])[_]
                trim_space(group) != ""
                trim_space(group) != "system:authenticated"
              }
              result := {
                "authenticated": true,
                "authorization": authorization,
                "access_token": trim_prefix(authorization, "Bearer "),
                "username": username,
                "email": object.get(claims, "$(oidcEmailClaim)", ""),
                "groups_header": json.marshal(array.concat(["system:authenticated"], sort(groups)))
              }
            } else = result {
              input.auth.identity.anonymous
              cookie := object.get(input.context.request.http.headers, "cookie", "")
              cookie != ""
              response := http.send({
                "method": "GET",
                "url": "http://$(authProxyName).$(workloadNamespace).svc.$(clusterDnsDomain):$(authProxyHttpPort)$(oauthPathPrefix)/auth",
                "headers": {"Cookie": cookie},
                "timeout": "$(sessionCheckTimeout)",
                "cache": false,
                "enable_redirect": false,
                "raise_error": false
              })
              {200, 202}[response.status_code]
              token := object.get(response.headers, "x-auth-request-access-token", [""])[0]
              usernames := [user |
                user := [object.get(response.headers, "x-auth-request-preferred-username", [""])[0], object.get(response.headers, "x-auth-request-user", [""])[0]][_]
                user != ""
              ]
              username := usernames[0]
              token != ""
              groups := {trim_space(group) |
                group := split(object.get(response.headers, "x-auth-request-groups", [""])[0], ",")[_]
                trim_space(group) != ""
                trim_space(group) != "system:authenticated"
              }
              result := {
                "authenticated": true,
                "authorization": concat("", ["Bearer ", token]),
                "access_token": token,
                "username": username,
                "email": object.get(response.headers, "x-auth-request-email", [""])[0],
                "groups_header": json.marshal(array.concat(["system:authenticated"], sort(groups)))
              }
            } else = {"authenticated": false}
      require-auth:
        priority: 1
        patternMatching:
          patterns:
            - predicate: auth.authorization['session-and-identity'].identity.authenticated
      client-bound:
        priority: 1
        when:
          - predicate: '!has(auth.identity.anonymous)'
        patternMatching:
          patterns:
            - predicate: has(auth.identity.iss) && auth.identity.iss == '$(oidcIssuerUrl)'
            - predicate: has(auth.identity.azp) && auth.identity.azp == '$(oidcClientId)'
    response:
      success:
        headers:
          authorization:
            plain:
              expression: auth.authorization['session-and-identity'].identity.authorization
          x-maas-username:
            plain:
              expression: auth.authorization['session-and-identity'].identity.username
          x-maas-group:
            plain:
              expression: auth.authorization['session-and-identity'].identity.groups_header
          x-maas-orgid:
            plain:
              expression: auth.authorization['session-and-identity'].organization.org_id
          x-maas-roles:
            plain:
              expression: auth.authorization['session-and-identity'].organization.roles_header
          x-auth-request-user:
            plain:
              expression: auth.authorization['session-and-identity'].identity.username
          x-auth-request-email:
            plain:
              expression: auth.authorization['session-and-identity'].identity.email
          x-forwarded-access-token:
            plain:
              expression: auth.authorization['session-and-identity'].identity.access_token
          cookie:
            plain:
              expression: auth.authorization['session-and-identity'].application_cookies
      unauthenticated:
        code: 401
        message:
          value: Invalid bearer token
      unauthorized:
        code: 302
        message:
          value: Redirecting to login
        headers:
          Location:
            expression: |
              has(auth.authorization) && 'session-and-identity' in auth.authorization ? auth.authorization['session-and-identity'].login_location : '$(oauthPathPrefix)/start?rd=%2Fmaas-portal%2F'
          Cache-Control:
            value: no-store
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: $(oauthRouteName)-anonymous
  namespace: $(workloadNamespace)
  labels:
    app.kubernetes.io/part-of: $(partOfLabel)
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: $(oauthRouteName)
  rules:
    authentication:
      public-login:
        anonymous: {}
